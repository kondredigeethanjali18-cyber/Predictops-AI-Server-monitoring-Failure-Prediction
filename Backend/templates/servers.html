{% extends "base.html" %}

{% block content %}

<div class="dashboard-header page-header-row">
    <div>
        <h1>Server Inventory</h1>
        <p>Live utilization snapshot for every monitored server</p>
    </div>

    <div class="page-actions">
        <input
            type="text"
            id="searchBox"
            placeholder="Search server">

        <button id="exportBtn">
            <i class="fas fa-file-export"></i>
            Export CSV
        </button>
    </div>
</div>

<div class="notification-bar" id="serverNotification">
    <i class="fas fa-circle-info"></i>
    <span>Loading server health notification...</span>
</div>

<div class="cards compact-cards">
    <div class="card total-card">
        <h3>Total Servers</h3>
        <div class="metric" id="serverTotalCount">0</div>
    </div>

    <div class="card healthy-card">
        <h3>Average CPU</h3>
        <div class="metric" id="serverAverageCpu">0%</div>
    </div>

    <div class="card warning-card">
        <h3>High Utilization</h3>
        <div class="metric" id="serverHighCpuCount">0</div>
    </div>
</div>

<div class="table-section">
    <table id="serversTable">
        <thead>
            <tr>
                <th>Server</th>
                <th>CPU</th>
                <th>Memory</th>
                <th>Disk</th>
            </tr>
        </thead>

        <tbody id="serverTableBody"></tbody>
    </table>
</div>

<div class="pagination" id="serversPagination"></div>

<script src="/static/js/servers.js?v={{ asset_version('js/servers.js') }}"></script>

{% endblock %}
