<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PredictOps AI{% endblock %}</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version('css/style.css') }}">

    {% block styles %}{% endblock %}
</head>
<body>
    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">PredictOps AI</a>
            <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle navigation" type="button">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/dashboard"><i class="fas fa-gauge-high"></i> Dashboard</a></li>
                <li><a href="/servers"><i class="fas fa-server"></i> Server Inventory</a></li>
                <li><a href="/predictions"><i class="fas fa-crystal-ball"></i> Predictions</a></li>
                <li><a href="/alerts"><i class="fas fa-tower-broadcast"></i> Live Monitoring Alerts</a></li>
                <li><a href="/insights"><i class="fas fa-brain"></i> Insights</a></li>
                <li><a href="/analytics"><i class="fas fa-chart-bar"></i> Analytics</a></li>
                {% if user %}
                <li class="nav-user-item"><span class="nav-user"><i class="fas fa-user-circle"></i> {{ user }}</span></li>
                <li><a href="/logout" class="nav-logout"><i class="fas fa-right-from-bracket"></i> Logout</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('navbarToggle');
            const menu = document.getElementById('navMenu');
            const overlay = document.getElementById('navOverlay');

            function toggleMobileMenu(open) {
                const isOpen = open !== undefined ? open : !menu.classList.contains('active');
                menu.classList.toggle('active', isOpen);
                if (overlay) overlay.classList.toggle('active', isOpen);
                const icon = toggle ? toggle.querySelector('i') : null;
                if (icon) {
                    icon.classList.toggle('fa-bars', !isOpen);
                    icon.classList.toggle('fa-xmark', isOpen);
                }
            }

            if (toggle && menu) {
                toggle.addEventListener('click', () => toggleMobileMenu());
            }

            if (overlay) {
                overlay.addEventListener('click', () => toggleMobileMenu(false));
            }

            // Highlight Active Link
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-menu a').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });

        // Prevent viewing cached authenticated pages on back-button navigation after logout
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && (performance.navigation.type === 2 || (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]?.type === "back_forward")))) {
                window.location.reload();
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
