{% extends "base.html" %}

{% block content %}

<h1>Alerts</h1>

<div class="notification-bar" id="alertsNotification">
    <i class="fas fa-circle-info"></i>
    <span>Loading alert notification...</span>
</div>

<table>
    <thead>
        <tr>
            <th>Server</th>
            <th>Prediction</th>
            <th>Confidence</th>
            <th>Severity</th>
            <th>Possible Causes</th>
        </tr>
    </thead>

    <tbody id="alertsTableBody"></tbody>
</table>

<div class="pagination">
    <button id="prevAlertBtn">Previous</button>
    <span id="alertPageNumber">Page 1 of 1</span>
    <button id="nextAlertBtn">Next</button>
</div>

<script src="/static/js/alerts.js?v={{ asset_version('js/alerts.js') }}"></script>

{% endblock %}
