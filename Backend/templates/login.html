<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PredictOps AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: 
                linear-gradient(135deg, rgba(8, 13, 26, 0.98), rgba(21, 45, 89, 0.95)),
                #0f172a;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(10px);
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(37, 99, 235, 0.05));
            border: 1px solid rgba(37, 99, 235, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
        }
        .brand-icon i {
            font-size: 26px;
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .login-card h2 {
            margin: 0 0 8px;
            color: white;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .login-card p {
            color: #94a3b8;
            margin: 0 0 32px;
            font-size: 14px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            transition: color 0.2s;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            font-size: 15px;
            color: white;
            background: rgba(15, 23, 42, 0.4);
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper input:focus {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .input-wrapper input:focus + i {
            color: #3b82f6;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
            margin-top: 8px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }
        .btn-submit:hover {
            filter: brightness(1.1);
            box-shadow: 0 10px 20px -3px rgba(37, 99, 235, 0.4);
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .error-message {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .error-message i {
            font-size: 16px;
            color: #f87171;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-icon">
                <i class="fas fa-server"></i>
            </div>
            <h2>PredictOps AI</h2>
            <p>AI Powered Server Monitoring & Predictive Analytics</p>
            
            {% if error %}
            <div class="error-message">
                <i class="fas fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Enter username" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
